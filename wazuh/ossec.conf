<ossec_config>
  <localfile>
    <location>/var/ossec/logs/soc-ready-ids-input.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <localfile>
    <location>/var/ossec/logs/soc-ready-ids-enriched.json</location>
    <log_format>json</log_format>
  </localfile>

  <command>
    <name>soc-ready-ids-triage</name>
    <executable>active_response.py</executable>
    <extra_args>--project-root=/opt/soc-ready-ids --config=/opt/soc-ready-ids/config.yaml --dataset=combined --output-log=/var/ossec/logs/soc-ready-ids-enriched.json</extra_args>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <active-response>
    <disabled>no</disabled>
    <command>soc-ready-ids-triage</command>
    <location>local</location>
    <rules_group>soc_ready_ids_raw</rules_group>
  </active-response>
</ossec_config>
