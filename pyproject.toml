[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-ready-ids"
version = "0.1.0"
description = "SOC-ready explainable IDS triage research system to reduce alert fatigue."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.coverage.report]
exclude_also = [
  "def main\\(",
  "if __name__ == .__main__.:",
]
